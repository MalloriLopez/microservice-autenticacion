server:
  port: 8080
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    #include: null
    active: dev
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    username: "postgres"
    password: "postgres"
    database: "microservice-autenticacion"

security:
  jwt:
    secret: "VGhpc0lzQVNlY3JldEJhc2U2NEtleVdpdGgzMmJ5dGVzISEhISE="
    expiration-seconds: 3600
    issuer: "autenticacion"

