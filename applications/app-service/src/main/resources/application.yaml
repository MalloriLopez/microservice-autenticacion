server:
  port: 8080
spring:
  #docker
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    #include: null
    active: dev
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    #docker
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    schema: ${DB_SCHEMA}
    #local
#    host: "localhost"
#    port: 5432
#    username: "postgres"
#    password: "postgres"
#    database: "microservice-autenticacion"

security:
  jwt:
    secret: ${JWT_SECRET} #docker
    #secret: "VGhpc0lzQVNlY3JldEJhc2U2NEtleVdpdGgzMmJ5dGVzISEhISE=" #local
    expiration-seconds: 5184000
    issuer: "autenticacion"
logging:
  level:
    org.springframework: DEBUG
